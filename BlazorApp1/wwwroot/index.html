<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>BlazorApp1</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorApp1.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <script src="_framework/blazor.webassembly.js"></script>

            <script>
                // Отключаем Browser Link
                if (typeof (window.BrowserLink) !== 'undefined') {
                    window.BrowserLink = undefined;
                }
            </script>
            <script>
                window.formatText = function (textarea, before, after) {
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const selectedText = textarea.value.substring(start, end);

                    const newText = textarea.value.substring(0, start) +
                        before + selectedText + after +
                        textarea.value.substring(end);

                    textarea.value = newText;

                    // Устанавливаем позицию курсора
                    const newCursorPos = start + before.length;
                    textarea.selectionStart = newCursorPos;
                    textarea.selectionEnd = newCursorPos + selectedText.length;

                    // Возвращаем фокус
                    textarea.focus();
                };
            </script>
            <script>
                window.showToast = function (message, type = 'success') {
                    // You can use any toast library here, or simple alert
                    alert(message); // Temporary solution - replace with proper toast
                };
            </script>

            <script>
                function applyTextFormatting(textarea, before, after) {
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const selectedText = textarea.value.substring(start, end);
                    const newText = textarea.value.substring(0, start) +
                        before + selectedText + after +
                        textarea.value.substring(end);

                    textarea.value = newText;

                    // Устанавливаем курсор после вставленного текста
                    const newCursorPos = start + before.length;
                    textarea.setSelectionRange(newCursorPos, newCursorPos + selectedText.length);
                    textarea.focus();

                    return newText;
                }
            </script>
            <!-- Remove duplicate blazor.webassembly.js script -->
            <script src="_framework/blazor.webassembly.js" autostart="false"></script>
            <script>
                Blazor.start({
                    configureSignalR: function (builder) {
                        builder.withUrl("/_blazor", {
                            skipNegotiation: true,
                            transport: 1
                        });
                    }
                });
            </script>
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
